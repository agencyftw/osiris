name: Publish Docker image

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Two quick pushes to master must not race to overwrite the `latest` tag.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Check native image notes contract before publication
        run: |
          (cd .github/actions/render-release-notes && sha256sum --check SHA256SUMS)
          node --test scripts/docker-release-notes.test.mjs

      # arm64 is built under emulation — needed for CasaOS on ARM SBCs.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retain shared-format native image release notes
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_NATIVE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          (cd .github/actions/render-release-notes && sha256sum --check SHA256SUMS)
          node scripts/docker-release-notes.mjs "$RUNNER_TEMP/osiris-image-release-notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osiris-image-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-image-release-notes.md
          if-no-files-found: error
          retention-days: 90
