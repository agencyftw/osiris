name: Private container preview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: container-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Resolve private preview identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          VISIBILITY=$(gh api "/orgs/$OWNER/packages/container/${NAME,,}" --jq .visibility)
          test "$VISIBILITY" = private
          LIVE_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open") | .head.sha')
          test "$LIVE_HEAD" = "$HEAD_SHA"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:preview-pr-$PR_NUMBER-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-g${HEAD_SHA:0:12}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.identity.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record exact preview
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: echo "Container preview available with \`docker pull $IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
