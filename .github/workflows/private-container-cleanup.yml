name: Clean private container previews
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-preview-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node tools/private-container-cleanup.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
